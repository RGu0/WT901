[project]
name = "wt901"
version = "0.3.0"
description = "维特智能 WT901 系列惯性传感器硬件接口通用库（BLE 5.0 协议解析与指令下发）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["wt901", "witmotion", "imu", "ble", "bluetooth", "sensor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
    # py.typed 随包分发，下游 mypy --strict 可见完整类型（tests/test_package.py 有守卫）。
    # 不加 "License :: OSI Approved :: MIT License" 分类器：PEP 639 之后
    # license 字段是 SPDX 表达式，分类器成了第二处真相，两处迟早漂移。
    "Typing :: Typed",
]
dependencies = [
    # BLE 5.0 连接（WT9011DCL-BT50 等蓝牙从机）
    "bleak>=0.22,<1",
    # 串口/适配器透传需要额外的适配器硬件，目前没有该硬件，v0.1 不做（RAY-167 决策 O4）。
    # 留一个用不上的依赖会让下游误以为串口路径可用，所以不预留。
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    # 传输层与设备层的接口本身是 async，异步测试需要它
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.urls]
Repository = "https://github.com/RGu0/WT901"
Changelog = "https://github.com/RGu0/WT901/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wt901"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 传输层与设备层的公开接口全是 async。逐个打 marker 只会漏掉几个，
# 而漏掉的那个会「通过」得悄无声息——协程根本没被 await。
asyncio_mode = "auto"

# 用户级 uv 配置若把某个镜像设成 default，uv sync --locked 会因为 uv.lock 里
# 记的是 pypi.org 的 registry/artifact URL 而逐条比对失败——症状是「换台机器就
# 装不上」，而根因在仓库外，很难查。索引在这里显式固定，锁文件与索引的唯一权威
# 都在仓库内，本机镜像配置只作用于其他项目。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
